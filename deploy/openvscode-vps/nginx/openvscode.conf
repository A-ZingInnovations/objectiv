# Include inside the HTTPS server block on the a-zing.org VPS (certbot paths may differ).
# DNS: tools.a-zing.org → VPS

upstream objectiv_openvscode {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name tools.a-zing.org;

    # ssl_certificate     /etc/letsencrypt/live/tools.a-zing.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tools.a-zing.org/privkey.pem;

    client_max_body_size 200m;

    location / {
        proxy_pass http://objectiv_openvscode;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name tools.a-zing.org;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
